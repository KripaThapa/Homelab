apiVersion: v1
kind: ConfigMap
metadata:
  name: market-scanner-config
  namespace: market-research
data:
  MARKET_DATA_PROVIDER: alpaca_iex
  ALPACA_PAPER: 'true'
  FORMING_LOOKBACK_BARS: '6'
  FORMING_MIN_RETRACE_PCT: '0.003'
  FORMING_CLOUD_PROXIMITY_PCT: '0.004'
  FORMING_SLOW_TOLERANCE_PCT: '0.002'
  TRADING_WINDOW_START: 08:00
  TRADING_WINDOW_END: '10:00'
  TRADING_TIMEZONE: America/Chicago
  SCANNER_INTERVAL_SECONDS: '60'
  SCANNER_JSON_FALLBACK: 'false'
  DISCOVERY_ENABLED: 'true'
  DISCOVERY_INTERVAL_SECONDS: '300'
  DISCOVERY_TOP_N: '10'
  NIGHTLY_ANALYSIS_TIME: '18:00'
  NIGHTLY_ANALYSIS_TIMEZONE: America/Chicago
  BASELINE_NIGHTLY_ENABLED: 'true'
  BASELINE_MAX_CATCHUP_TRADING_DAYS: '5'
  BASELINE_PROVIDER_RETRIES: '3'
  BASELINE_RETRY_DELAY_SECONDS: '2'
  REPLAY_TIMEZONE: America/Chicago
  REPLAY_START: 08:00
  REPLAY_EQUITY_START: 08:30
  REPLAY_END: '10:00'
  REPLAY_WARMUP_CALENDAR_DAYS: '7'
  RIPSTER_DATA_DIR: /app/data
  PUBLIC_RATE_LIMIT_PER_MINUTE: '120'
  PUBLIC_EXPENSIVE_RATE_LIMIT_PER_MINUTE: '30'
  TRUSTED_HOSTS: localhost,127.0.0.1,backend
