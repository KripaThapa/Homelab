apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-frontend
  namespace: market-research
  labels:
    app: market-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: market-frontend
  template:
    metadata:
      labels:
        app: market-frontend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: frontend
        image: ghcr.io/kripathapa/market-scanner/frontend:sha-b495cb8
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        ports:
        - name: http
          containerPort: 8080
