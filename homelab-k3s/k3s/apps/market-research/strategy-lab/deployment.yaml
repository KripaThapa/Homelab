apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-strategy-lab
  namespace: market-research
  labels:
    app: market-strategy-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: market-strategy-lab
  template:
    metadata:
      labels:
        app: market-strategy-lab
    spec:
      automountServiceAccountToken: false
      containers:
      - name: strategy-lab
        image: ghcr.io/kripathapa/market-scanner/strategy-lab:sha-2569664
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        ports:
        - name: http
          containerPort: 8080
